# One input for plan.py: team profile + mapped options.
# Guardrails: add an org block here, or pass --org samples/org.yaml.
team:
  builders: 4
  operators: 2
  on_call: false
  platform_team: false
  skills:
    aws: 2
    containers: 2
    kubernetes: 0
    iac:
      terraform: 1
    ci_cd:
      github_actions: 2
    observability: 1
  preference: managed
options:
  - name: A. Serverless
    provider: aws
    region: eu-central-1
    components:
      - name: API
        product: Lambda
        class: serverless_functions
      - name: Primary DB
        product: RDS for PostgreSQL
        class: managed_database
      - name: CDN
        product: CloudFront
        class: cdn
        global: true
  - name: B. Managed containers
    provider: aws
    region: eu-central-1
    components:
      - name: API
        product: ECS on Fargate
        class: managed_containers
      - name: Primary DB
        product: RDS for PostgreSQL
        class: managed_database
      - name: Observability
        product: Datadog
        class: managed_observability
